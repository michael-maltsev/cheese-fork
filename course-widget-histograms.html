<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <script src="i18n.js"></script>
    <script src="locales/he.js"></script>
    <script src="locales/en.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title data-i18n="histogram.pageTitle">CheeseFork - היסטוגרמות</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="modules/bootstrap-rtl/css/bootstrap.min.css">
    <link rel="stylesheet" href="modules/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="components/histogram-browser/histogram-browser.css">
    <link rel="stylesheet" href="i18n.css">
    <style>
        .footer-promo {
            position: fixed;
            bottom: -10px;
            left: 10px;
            border-style: solid;
            border-width: thin;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body class="bg-light my-3">
<div class="container-fluid">
    <div id="content-container">
        <div class="form-group text-right">
            <div class="language-selector d-inline-flex">
                <i class="fas fa-globe" aria-hidden="true"></i>
                <label for="histogram-widget-language" class="sr-only" data-i18n="sharing.language">שפה</label>
                <select id="histogram-widget-language" class="language-switch" data-language-switch aria-label="שפה" data-i18n-aria-label="sharing.language">
                    <option value="en" lang="en">English</option>
                    <option value="he" lang="he">עברית</option>
                </select>
            </div>
        </div>
        <div class="inline-histograms" role="region" aria-label="היסטוגרמות" data-i18n-aria-label="histogram.title"></div>
        <div class="bg-light footer-promo">
            <a target="_blank" href=".">
                <img src="logo.png" alt="CheeseFork" height="30">
                <span class="font-weight-bold">CheeseFork</span>
            </a>
        </div>
    </div>
</div>
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-115440973-1"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'UA-115440973-1');
</script>
<script src="modules/fullcalendar/lib/jquery.min.js"></script>
<script src="modules/popper/popper.js"></script>
<script src="modules/bootstrap-rtl/js/bootstrap.min.js"></script>
<script src="components/histogram-browser/histogram-browser.js"></script>
<script>
    // https://stackoverflow.com/a/901144
    function getParameterByName(name, url) {
        if (!url) url = window.location.href;
        name = name.replace(/[\[\]]/g, "\\$&");
        var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, " "));
    }

    function toNewCourseNumber(course) {
        var match = /^9730(\d\d)$/.exec(course);
        if (match) {
            return '970300' + match[1];
        }

        match = /^(\d\d\d)(\d\d\d)$/.exec(course);
        if (match) {
            return '0' + match[1] + '0' + match[2];
        }

        return course;
    }

    function stringToCourseNumber(str) {
        if (!str || !/^[0-9]{1,8}$/.test(str)) {
            return null;
        }

        if (str.length <= 6) {
            return toNewCourseNumber(('00000' + str).slice(-6));
        } else {
            return ('0000000' + str).slice(-8);
        }
    }

    $('.footer-promo a').attr('href', CheeseI18n.withLocale('.'));
    var course = stringToCourseNumber(getParameterByName('course'));
    if (course) {
        var histogramBrowser = new HistogramBrowser($('.inline-histograms'), {
            selectColumnGrid: 'md',
            shareGuideInNewWindow: true
        });
        histogramBrowser.loadHistograms(course);
    } else {
        $('.inline-histograms').text(CheeseI18n.t('histogram.invalidCourse'));
    }
</script>
</body>
</html>
